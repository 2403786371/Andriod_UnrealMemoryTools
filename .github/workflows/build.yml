name: Build Android

on:
push:
branches:
- main
- master
pull_request:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android NDK
    run: |
      sdkmanager "ndk;26.3.11579264"

  - name: Install Ninja
    run: |
      sudo apt-get update
      sudo apt-get install -y ninja-build

  - name: Configure
    run: |
      cmake -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264

  - name: Build
    run: |
      cmake --build build -j$(nproc)

  - name: Upload Binary
    uses: actions/upload-artifact@v4
    with:
      name: UnrealMemoryTools-arm64-v8a
      path: outputs/arm64-v8a/**
```
