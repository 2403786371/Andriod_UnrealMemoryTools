name: Build UnrealMemoryTools

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装 NDK (并获取其真实路径)
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      # 2. 手动安装 Ninja 和 Vulkan 依赖
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build libvulkan-dev

      # 3. 安装 CMake
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # 4. 调试：打印 NDK 路径，确认是否正确
      - name: Debug NDK path
        run: |
          echo "ANDROID_NDK_HOME = $ANDROID_NDK_HOME"
          echo "ndk_path output = ${{ steps.ndk.outputs.ndk_path }}"

      # 5. 配置 CMake (使用正确的 NDK 路径)
      - name: Configure CMake
        run: |
          # 优先使用 action 输出的路径，它一定是 Linux 有效路径
          NDK="${{ steps.ndk.outputs.ndk_path }}"
          if [ -z "$NDK" ]; then
            NDK="$ANDROID_NDK_HOME"
          fi
          echo "Using NDK at: $NDK"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      # 6. 编译
      - name: Build
        run: cmake --build build --parallel 4

      # 7. 查找生成的二进制文件（调试用）
      - name: Locate binary
        run: find . -name "UnrealMemoryTools" -type f

      # 8. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnrealMemoryTools
          path: |
            **/UnrealMemoryTools
          if-no-files-found: error
