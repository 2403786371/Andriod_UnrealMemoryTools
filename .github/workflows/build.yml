name: Android NDK CI

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a]  # 项目只输出 arm64-v8a，可根据需要添加 armeabi-v7a

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'  # 拉取子模块（KittyMemoryEx 等）

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c  # 符合项目要求的 r25 或更新版本
        add-to-path: false
        local-cache: true

    - name: Configure CMake
      # 配置 CMake 构建，指定 Android 工具链
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.arch }} \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_LD=lld
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

    - name: Build with Ninja
      run: cmake --build build -j4

    - name: List outputs (debug)
      run: ls -la build/outputs/${{ matrix.arch }}/ || ls -la build/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnrealMemoryTools-${{ matrix.arch }}
        path: |
          build/UnrealMemoryTools
          build/outputs/${{ matrix.arch }}/UnrealMemoryTools
        if-no-files-found: error
