name: Build UnrealMemoryTools

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 NDK (并获取其安装路径)
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true
          local-cache: true

      # 2. 手动安装 Ninja 和 Vulkan 依赖
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build libvulkan-dev

      # 3. 安装 CMake
      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # 4. 强力覆盖环境变量 (解决方案核心)
      - name: Override NDK environment variables
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Correct NDK path is: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      # 5. 配置 CMake (显式使用正确路径)
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      # 6. 编译
      - name: Build
        run: cmake --build build --parallel 4

      # 7. 查找二进制文件 (调试用)
      - name: Locate binary
        run: find . -name "UnrealMemoryTools" -type f

      # 8. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnrealMemoryTools
          path: |
            **/UnrealMemoryTools
          if-no-files-found: error
